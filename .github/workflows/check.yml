name: check

on: [push, pull_request]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q run.py lookout plugins tests
      - name: Check JS syntax
        run: node --check web/app.js
      - name: Run unit tests
        env:
          PYTHONUTF8: "1"
          LOOKOUT_DATA_DIR: ${{ runner.temp }}/lookout-ci
          LOOKOUT_PLUGIN_DIR: ${{ runner.temp }}/lookout-plugins
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check --exit-zero .

  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright
        run: pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run UI smoke tests
        env:
          PYTHONUTF8: "1"
          LOOKOUT_DATA_DIR: ${{ runner.temp }}/lookout-ci-ui
          LOOKOUT_PLUGIN_DIR: ${{ runner.temp }}/lookout-plugins-ui
          LOOKOUT_REQUIRE_UI_TEST: "1"
        run: python -m unittest tests/test_ui.py -v
