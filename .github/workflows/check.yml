name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q run.py lookout plugins tests
      - name: Check JS syntax
        run: node --check web/app.js
      - name: Run unit tests
        env:
          LOOKOUT_DATA_DIR: ${{ runner.temp }}/lookout-ci
          LOOKOUT_PLUGIN_DIR: ${{ runner.temp }}/lookout-plugins
        run: python -m unittest discover -s tests -v
