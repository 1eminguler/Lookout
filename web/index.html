<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lookout-token" content="">
<title>Lookout</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="mark pywebview-drag-region"><img src="icon.svg" alt="">Lookout</div>
    <div class="drag pywebview-drag-region"></div>
    <div class="winbtns">
      <button data-win="minimize" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button data-win="toggle_maximize" aria-label="Maximize"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
      <button data-win="close" class="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>
  <div class="body">
    <aside class="side">
      <button class="newscan" id="scanBtn" data-act="scan">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
        <span id="scanLabel">New scan</span><span class="sub" id="scanSub"></span>
      </button>
      <nav class="nav">
        <a href="#/home" data-nav="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 12l5-5"/></svg>Home</a>
        <a href="#/feed" data-nav="feed"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Feed<em id="navFeed"></em></a>
        <a href="#/agenda" data-nav="agenda"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda<em id="navAgenda"></em></a>
        <a href="#/sources" data-nav="sources"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/></svg>Sources<em id="navSources"></em></a>
        <a href="#/filters" data-nav="filters"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg>Filters<em id="navFilters"></em></a>
      </nav>
      <div class="side-head">Watches<a href="#/home" title="New watch" aria-label="New watch"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a></div>
      <div class="watches" id="watches"></div>
      <div class="hist-head">History</div>
      <div class="hist" id="history"></div>
      <div class="side-bottom">
        <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
