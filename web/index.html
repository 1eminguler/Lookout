<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookout</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="mark pywebview-drag-region"><img src="icon.svg" alt="">Lookout</div>
    <div class="drag pywebview-drag-region"></div>
    <div class="winbtns">
      <button data-win="minimize" aria-label="Minimize"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button data-win="toggle_maximize" aria-label="Maximize"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg></button>
      <button data-win="close" class="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>
  <div class="body">
    <div class="side">
      <nav class="nav" aria-label="Main navigation">
        <a href="#/opportunities" data-nav="opportunities"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Opportunities</a>
        <a href="#/agenda" data-nav="agenda"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Agenda</a>
        <a href="#/watches" data-nav="watches"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Watches</a>
      </nav>
      <button class="btn primary new-watch" type="button" data-goto="#/watches/new"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New watch</button>
      <div class="side-bottom">
        <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</a>
      </div>
    </div>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
